[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-storebot-fastest"
version = "0.1.0"
description = "Fastest Telegram store bot"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "pydantic-settings>=2.6,<3",
    "tzdata>=2026.4",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Env vars must be set before app imports (Settings() runs at module level).
"scripts/**" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
